[project]
name = "arcsavelab"
version = "0.2.0"
description = "A local-first Arcaea save workbench with a modern terminal interface"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RinOfficial"}]
dependencies = ["textual>=6.0,<9"]

[project.scripts]
arcsavelab = "arcsavelab.adapters.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.12,<1", "mypy>=1.15,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arcsavelab"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs", "/scripts", "/README.md", "/README_CN.md", "/CONTRIBUTING.md", "/CONTEXT.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.github", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib --strict-config --strict-markers -ra"
asyncio_mode = "auto"
xfail_strict = true

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]
extend-exclude = [".old_ver", ".examples", ".local", "build", "dist"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
files = ["src/arcsavelab"]
mypy_path = "src"
strict = true
show_error_codes = true

[tool.coverage.run]
branch = true
source = ["arcsavelab"]

[tool.coverage.report]
show_missing = true
skip_covered = true
